<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Only this site's own files may run; the GitHub key can only ever be sent to GitHub -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>AMI Online Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%2355388A%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial,sans-serif%27 font-weight=%27900%27 font-size=%2726%27 fill=%27white%27 text-anchor=%27middle%27%3EAMI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Vazirmatn:wght@400..800&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <link rel="stylesheet" href="../css/components.css?v=2">
  <link rel="stylesheet" href="../css/admin.css?v=4">
</head>
<body class="admin">

  <!-- Sign in and first-time setup (drawn by js/gh-admin.js) -->
  <main class="login" id="gateView"><p class="muted">…</p></main>

  <!-- Panel -->
  <div class="panel" id="panelView" hidden>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="topbar-brand" href="../" target="_blank" rel="noopener" data-i18n-aria="viewMenu">
          <span class="wordmark wordmark-xs" role="img" aria-label="Ami"></span>
          <span class="eyebrow" data-i18n="onlineAdmin">Online admin</span>
        </a>
        <nav class="tabs" role="tablist" aria-label="Admin sections">
          <button class="tab" type="button" role="tab" data-tab="menu" aria-selected="true"><span data-i18n="tabMenu">Menu</span></button>
          <button class="tab" type="button" role="tab" data-tab="account" aria-selected="false"><span data-i18n="tabAccount">Account</span></button>
        </nav>
        <div class="topbar-tools">
          <button class="icon-btn lang-btn" type="button" data-lang-toggle lang="fa">فا</button>
          <button class="icon-btn" type="button" data-theme-toggle>
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm" type="button" id="logoutBtn" data-i18n="signOut">Sign out</button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="banner banner-error" id="errorBanner" hidden>
        <span id="errorText"></span>
        <button class="btn btn-sm" type="button" id="reloadBtn" data-i18n="reloadMenu">Load the newest menu</button>
      </div>
      <section class="tab-panel" id="tab-menu" role="tabpanel"></section>
      <section class="tab-panel" id="tab-account" role="tabpanel" hidden></section>
    </div>

    <!-- Unpublished changes -->
    <div class="publish-bar" id="publishBar" hidden>
      <div class="wrap publish-inner">
        <span class="publish-count" id="publishCount" role="status"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="discardBtn" data-i18n="discard">Discard</button>
        <button class="btn" type="button" id="publishBtn" data-i18n="publish">Publish</button>
      </div>
    </div>
  </div>

  <dialog class="sheet" id="itemDialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>

  <script type="module" src="../js/gh-admin.js"></script>
</body>
</html>
