<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AMI Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%2355388A%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial,sans-serif%27 font-weight=%27900%27 font-size=%2726%27 fill=%27white%27 text-anchor=%27middle%27%3EAMI%3C/text%3E%3C/svg%3E">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Vazirmatn:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

  <!-- Sign in -->
  <main class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-brand">
        <span class="wordmark wordmark-sm" role="img" aria-label="Ami"></span>
        <span class="eyebrow" data-i18n="admin">Admin</span>
      </div>
      <h1 data-i18n="signInTitle">Staff sign in</h1>
      <p class="muted" data-i18n="signInBody">Enter the admin password to manage orders, the menu and the club.</p>
      <label class="field">
        <span data-i18n="password">Password</span>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn btn-wide" type="submit" data-i18n="signIn">Sign in</button>
      <div class="login-tools">
        <button class="icon-btn lang-btn" type="button" data-lang-toggle lang="fa">فا</button>
        <button class="icon-btn" type="button" data-theme-toggle>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
      </div>
    </form>
  </main>

  <!-- Panel -->
  <div class="panel" id="panelView" hidden>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="topbar-brand" href="index.html" target="_blank" rel="noopener" data-i18n-aria="viewMenu">
          <span class="wordmark wordmark-xs" role="img" aria-label="Ami"></span>
          <span class="eyebrow" data-i18n="admin">Admin</span>
        </a>
        <nav class="tabs" role="tablist" aria-label="Admin sections">
          <button class="tab" type="button" role="tab" data-tab="orders" aria-selected="true">
            <span data-i18n="tabOrders">Orders</span><span class="badge-inline" id="newCount" hidden>0</span>
          </button>
          <button class="tab" type="button" role="tab" data-tab="menu" aria-selected="false"><span data-i18n="tabMenu">Menu</span></button>
          <button class="tab" type="button" role="tab" data-tab="club" aria-selected="false"><span data-i18n="tabClub">Club</span></button>
          <button class="tab" type="button" role="tab" data-tab="settings" aria-selected="false"><span data-i18n="tabSettings">Settings</span></button>
        </nav>
        <div class="topbar-tools">
          <button class="icon-btn" type="button" id="soundBtn" aria-pressed="true">
            <svg class="i-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
            <svg class="i-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>
          </button>
          <button class="icon-btn lang-btn" type="button" data-lang-toggle lang="fa">فا</button>
          <button class="icon-btn" type="button" data-theme-toggle>
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm" type="button" id="logoutBtn" data-i18n="signOut">Sign out</button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="banner" id="defaultPwBanner" hidden>
        <span data-i18n="defaultPassword"></span>
        <button class="btn btn-sm" type="button" data-goto-tab="settings" data-i18n="goToSettings">Change password</button>
      </div>
      <p class="banner banner-error" id="offlineBanner" hidden data-i18n="offline"></p>

      <section class="tab-panel" id="tab-orders" role="tabpanel"></section>
      <section class="tab-panel" id="tab-menu" role="tabpanel" hidden></section>
      <section class="tab-panel" id="tab-club" role="tabpanel" hidden></section>
      <section class="tab-panel" id="tab-settings" role="tabpanel" hidden></section>
    </div>
  </div>

  <dialog class="sheet" id="itemDialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
