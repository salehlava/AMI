<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AMI Café Menu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%2355388A%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial,sans-serif%27 font-weight=%27900%27 font-size=%2726%27 fill=%27white%27 text-anchor=%27middle%27%3EAMI%3C/text%3E%3C/svg%3E">
  <meta name="description" content="AMI café drinks menu: espresso, hot and cold bar, shakes, tea, iced coffee, syrups and add-ons.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Vazirmatn:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Masthead: brand, theme + language switches, flavor shortcuts -->
  <header class="wrap masthead">
    <div class="mast-top">
      <p class="eyebrow" data-i18n="eyebrow">Drinks menu</p>
      <div class="mast-actions">
        <button class="pill-btn" id="clubBtn" type="button" aria-label="Open AMI Club">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg>
          <span class="club-btn-label" data-i18n="clubButton">AMI Club</span>
        </button>
        <button class="icon-btn basket-btn" id="basketBtn" type="button" aria-label="Basket">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14l-1.3 10.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8zM9 9V7a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="basketCount" hidden>0</span>
        </button>
        <button class="icon-btn lang-btn" id="langBtn" type="button" lang="fa" aria-label="نمایش منو به فارسی">فا</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <h1 class="brand">
      <span class="wordmark" lang="en">AMI</span>
      <span class="brand-tag">
        <b data-i18n="cafe">café</b>
        <span id="lede"></span>
      </span>
    </h1>

    <div class="flavors">
      <span class="flavors-label" id="flavorsLabel" data-i18n="pickFlavor">Pick a flavor</span>
      <div class="flavor-row" id="flavors" role="group" aria-labelledby="flavorsLabel"></div>
    </div>
  </header>

  <!-- Sticky toolbar: search, filters, category strip (phones) -->
  <div class="toolbar" id="toolbar">
    <div class="wrap">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
               placeholder="Search drinks, flavors or bars" aria-label="Search the menu"
               data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel">
        <span class="kbd" id="kbd" aria-hidden="true">/</span>
        <button class="clear" id="clear" type="button" aria-label="Clear search" data-i18n-aria="clearSearch" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </label>

      <div class="filters" role="group" aria-label="Filter drinks" data-i18n-aria="filtersLabel">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">
          <span data-i18n="all">All</span>
        </button>
        <button class="chip" type="button" data-filter="hot" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3c-1 1.5 1 2.5 0 4M12 3c-1 1.5 1 2.5 0 4M16 3c-1 1.5 1 2.5 0 4M4 10h14v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-4zM18 11h1a2.5 2.5 0 0 1 0 5h-1.5"/></svg>
          <span data-i18n="hot">Hot</span>
        </button>
        <button class="chip" type="button" data-filter="cold" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6.5l16 11M20 6.5l-16 11M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg>
          <span data-i18n="cold">Cold</span>
        </button>
        <button class="chip" type="button" data-filter="saved" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z"/></svg>
          <span data-i18n="saved">Saved</span>
          <span class="n" id="savedCount">0</span>
        </button>
        <button class="text-btn" id="expandAll" type="button">Expand all</button>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
      <nav class="rail" id="rail" aria-label="Menu sections" data-i18n-aria="sections"></nav>
    </div>
  </div>

  <!-- Menu -->
  <div class="wrap layout">
    <nav class="index" aria-label="Menu sections" data-i18n-aria="sections">
      <p class="index-label" data-i18n="onTheMenu">On the menu</p>
      <ul id="index"></ul>
    </nav>
    <main>
      <div id="menu"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>

  <footer class="wrap foot">
    <strong data-i18n="footName">AMI café</strong>
    <p data-i18n-html="footer"></p>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top" data-i18n-aria="toTop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <!-- Floating basket / order-status bar -->
  <div class="basket-bar" id="basketBar" hidden></div>

  <!-- Dialogs (filled by js/basket.js and js/club.js) -->
  <dialog class="sheet" id="itemSheet"></dialog>
  <dialog class="sheet" id="basketSheet"></dialog>
  <dialog class="sheet" id="ordersSheet"></dialog>
  <dialog class="sheet" id="clubSheet"></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
